# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
workflows:
  ios-diagnose-tables:
    name: Codex Remote - table conversion tests only
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - build/SourcePackages
    scripts:
      - name: Install pinned XcodeGen
        script: bash scripts/ci/install-xcodegen.sh
      - name: Diagnose generated table content
        script: bash scripts/ci/diagnose-ios.sh CodexRemoteTests/MarkdownTableTests
    artifacts:
      - build/commit.txt
      - build/ios-test.log
      - build/ios-test-summary.json
      - build/ios-screenshots.zip
  ios-diagnose-approval:
    name: Codex Remote - approval hang diagnosis only
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - build/SourcePackages
    scripts:
      - name: Install pinned XcodeGen
        script: bash scripts/ci/install-xcodegen.sh
      - name: Reproduce approval and sample simulator process
        script: CODEX_CAPTURE_SCROLL_TRACE=1 bash scripts/ci/diagnose-ios.sh
    artifacts:
      - build/commit.txt
      - build/ios-test.log
      - build/ios-test-summary.json
      - build/approval-diagnostics.zip
      - build/scroll-trace.log
      - build/ios-screenshots.zip
  ios-verify-package:
    name: Codex Remote - test and unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "26.3"
    cache:
      cache_paths:
        - build/SourcePackages
    # Start manually or via the API while iterating; avoid duplicate builds.
    scripts:
      - name: Verify pipeline failure gates
        script: bash scripts/ci/tests/codemagic-ios.test.sh
      - name: Install pinned XcodeGen
        script: bash scripts/ci/install-xcodegen.sh
      - name: Test, retain diagnosis, then package
        script: bash scripts/ci/codemagic-ios.sh
    artifacts:
      - build/CodexRemote-unsigned.ipa
      - build/CodexRemote-unsigned.ipa.sha256
      - build/commit.txt
      - build/Package.resolved
      - build/ios-test-summary.json
      - build/ios-test.log
      - build/ios-package.log
      - build/CodexRemote-tests.zip
      - build/ios-screenshots.zip
