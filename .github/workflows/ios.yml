name: iOS
on:
  workflow_dispatch:
    inputs:
      only_testing:
        description: Optional Xcode test filter (diagnosis only, no IPA)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify pipeline failure gates
        run: bash scripts/ci/tests/codemagic-ios.test.sh
      - name: Install pinned XcodeGen
        run: bash scripts/ci/install-xcodegen.sh
      - name: Run focused diagnostic tests (no package)
        if: inputs.only_testing != ''
        env:
          ONLY_TESTING: ${{ inputs.only_testing }}
        run: bash scripts/ci/diagnose-ios.sh "$ONLY_TESTING"
      - name: Run all tests and archive device IPA only after success
        if: inputs.only_testing == ''
        run: bash scripts/ci/codemagic-ios.sh
      - name: Keep screenshots and test recordings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-results-${{ github.sha }}
          path: |
            build/commit.txt
            build/ios-test.log
            build/ios-test-summary.json
            build/CodexRemote-tests.zip
            build/ios-screenshots.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Keep verified device IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.only_testing == ''
        with:
          name: CodexRemote-unsigned-${{ github.sha }}
          path: |
            build/CodexRemote-unsigned.ipa
            build/CodexRemote-unsigned.ipa.sha256
            build/commit.txt
            build/Package.resolved
            build/ios-test-summary.json
          if-no-files-found: error
          retention-days: 7
